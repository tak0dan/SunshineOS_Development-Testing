LABEL sunshine
TEXT HELP
Boot the SunshineOS live environment.
Includes update, upgrade, migration, sanity, health and repair tooling.
ENDTEXT
MENU LABEL SunshineOS live environment (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=4G %KERNEL_PARAMS%

LABEL sunshine_sanity
TEXT HELP
Boot SunshineOS and run read-only sanity and health assessments at startup.
ENDTEXT
MENU LABEL SunshineOS live environment (%ARCH%, BIOS) - assessment mode
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=4G sunshine.assess=1 %KERNEL_PARAMS%
