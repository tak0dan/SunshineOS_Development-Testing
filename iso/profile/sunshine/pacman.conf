#
# Pacman configuration used while building the SunshineOS image.
# The live image receives its own copy in airootfs/etc/pacman.conf.
#
[options]
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional
RemoteFileSigLevel = Required

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

