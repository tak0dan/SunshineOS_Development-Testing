name: SunshineOS image build

on:
  workflow_dispatch:
  push:
    branches:
      - development
    paths:
      - 'iso/**'
      - 'evolution-engine/**'
      - '.github/workflows/iso-build.yml'

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base@sha256:d4594bb2300cba11f41c2f27923eb56f63d9988909c402f9c95517d1e362c899
      options: --privileged
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install build dependencies
        run: pacman -Syu --noconfirm base-devel archiso squashfs-tools xorriso mtools dosfstools python3 git bash
      - name: Build and verify image
        run: ./iso/build.sh
      - name: Upload image and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sunshineos-iso
          path: iso/out/*
          if-no-files-found: error
      - name: Audit workflow trust policy
        run: python3 autonomy/codex/ci_policy_audit.py .
