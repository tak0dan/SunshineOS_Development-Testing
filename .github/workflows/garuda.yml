name: Garuda-derived safety regressions

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  garuda-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate pinned Garuda catalogue
        run: python3 autonomy/codex/garuda_catalog.py
      - name: Run portable Garuda safety regressions
        run: >-
          python3 -m unittest -v
          autonomy.codex.test_pacman_lock_repair
          autonomy.codex.test_garuda_catalog.GarudaCatalogTests.test_GARUDA_CAT_001_source_revision_and_records_validate
          autonomy.codex.test_garuda_catalog.GarudaCatalogTests.test_GARUDA_CAT_002_adoption_needs_plan_journal_and_verification
          autonomy.codex.test_garuda_catalog.GarudaCatalogTests.test_GARUDA_CAT_003_duplicate_ids_fail_closed
          autonomy.codex.test_garuda_catalog.GarudaCatalogTests.test_GARUDA_CAT_004_adopted_pattern_without_journal_is_rejected
          autonomy.codex.test_garuda_catalog.GarudaCatalogTests.test_GARUDA_CAT_005_invalid_invariant_reference_is_rejected
          autonomy.codex.test_garuda_catalog.GarudaCatalogTests.test_GARUDA_CAT_006_non_object_catalog_fails_closed
          autonomy.codex.test_garuda_catalog.GarudaCatalogTests.test_GARUDA_CAT_007_revision_must_be_full_lowercase_hex
          autonomy.codex.test_garuda_catalog.GarudaCatalogTests.test_GARUDA_CAT_008_non_object_finding_fails_closed
          autonomy.codex.test_garuda_catalog.GarudaCatalogTests.test_GARUDA_CAT_009_source_path_traversal_is_rejected
          autonomy.codex.test_garuda_catalog.GarudaCatalogTests.test_GARUDA_CAT_010_malformed_control_shape_fails_closed
      - name: Audit workflow trust policy
        run: python3 autonomy/codex/ci_policy_audit.py .
