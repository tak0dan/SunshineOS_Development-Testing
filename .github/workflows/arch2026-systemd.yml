name: Arch 2026 systemd regressions

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  systemd-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run systemd inventory, repair, discovery and compatibility regressions
        working-directory: evolution-engine
        run: >-
          python3 -m unittest -v
          tests.test_systemd_inventory
          tests.test_systemd_repair
          tests.test_discovery
          tests.test_compatibility
      - name: Audit workflow trust policy
        run: python3 autonomy/codex/ci_policy_audit.py .
